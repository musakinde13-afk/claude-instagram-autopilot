[build]
  publish = "public"
  command = "sh build.sh"

# The one place for the site address and business details. build.sh writes
# them into every page, the sitemap and robots.txt on each deploy.
[build.environment]
  SITE_URL = "https://blaymires-callout.netlify.app"
  GAS_SAFE_NO = "[add before launch]"
  BUSINESS_EMAIL = "[add before launch]"

# Netlify serves HTTPS and redirects http automatically; HSTS keeps browsers on it.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=()"
    # Demo only: keeps the unapproved site out of Google. Delete this line at launch.
    X-Robots-Tag = "noindex"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

